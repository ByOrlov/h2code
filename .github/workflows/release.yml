name: Release

on:
  push:
    branches: [master]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (YYYY.MM.DD, YYYY.MM.DD.N or auto-tag YYYY.MM.DD-<secs>)"
        required: true

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (auto-increment build number per day)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Branch push / PR / merge queue: a CI build, not a release. Skip
          # version math. PR refs are "N/merge" (leading digit!), so gate on
          # the ref type instead of a digit heuristic. Dispatch runs pass a
          # version input and always take the release path below.
          if [ -z "${{ inputs.version }}" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the raw tag pushed (or the dispatch input).
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          echo "Pushed tag: $RAW"

          # YYYY.MM.DD form → compute next build number for that day. Also
          # accepts post-commit auto-tags YYYY.MM.DD-<secs from day begin>
          # (with optional .N collision suffix): they mark a commit, not a
          # release, so the build number is computed the same way.
          if [[ "$RAW" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})(-[0-9]+(\.[0-9]+)?)?$ ]]; then
            DAY="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            # Find existing release tags for this day and pick the max N.
            EXISTING=$(git tag -l "${DAY}.*" 2>/dev/null || true)
            MAX=0
            if [ -n "$EXISTING" ]; then
              for t in $EXISTING; do
                n=$(echo "$t" | awk -F. '{print $4}')
                n=${n:-0}
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            # Also check the GitHub releases API (covers tags pushed then deleted).
            LATEST_API=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null || true)
            if echo "$LATEST_API" | grep -qE "${DAY}\."; then
              for t in $(echo "$LATEST_API" | grep -oE "${DAY}\.[0-9]+"); do
                n=$(echo "$t" | awk -F. '{print $4}')
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            N=$((MAX + 1))
            VERSION="${DAY}.${N}"
          elif [[ "$RAW" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            VERSION="$RAW"
          else
            echo "::error::Tag '$RAW' does not match YYYY.MM.DD, YYYY.MM.DD.N or YYYY.MM.DD-<secs> (auto-tag)"
            exit 1
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-version
    runs-on: ${{ matrix.runner }}
    env:
      H2CODE_VERSION: ${{ needs.compute-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-darwin
            runner: macos-latest
            archive: tar.gz
            cross_target: x86_64-apple-darwin
          - target: aarch64-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-windows
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Set up MSVC (Windows native build)
        if: matrix.target == 'x86_64-windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up x86_64 libraries (macOS cross-compile)
        if: matrix.cross_target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          # Homebrew dropped Intel macOS support entirely (Sept 2026): the
          # installer itself refuses to run under Rosetta, so there is no
          # brew, no bottles and no brew cache to scavenge. Build the three
          # link dependencies from source instead, under `arch -x86_64`
          # (inside a Rosetta shell plain `cc` targets x86_64), into
          # $HOME/x86_64-libs. The dylib rebind step later matches any
          # absolute libssl/libcrypto path, so the custom prefix is picked
          # up there automatically.
          PREFIX="$HOME/x86_64-libs"
          SRC="$PREFIX/src"
          rm -rf "$PREFIX"
          mkdir -p "$SRC"
          JOBS="$(sysctl -n hw.ncpu)"

          # openssl 3.x — Configure's darwin64-x86_64-cc target plus the
          # build_sw / install_sw targets skip the test binaries that
          # crash under Rosetta.
          curl -fsSL --retry 3 -o "$SRC/openssl.tar.gz" \
            "https://www.openssl.org/source/openssl-3.5.4.tar.gz"
          mkdir "$SRC/openssl" && tar xzf "$SRC/openssl.tar.gz" -C "$SRC/openssl" --strip-components=1
          (
            cd "$SRC/openssl"
            arch -x86_64 ./Configure darwin64-x86_64-cc \
              --prefix="$PREFIX" --libdir=lib no-tests no-docs
            arch -x86_64 make -j"$JOBS" build_sw
            arch -x86_64 make install_sw
          )

          # libyaml — plain autotools build.
          curl -fsSL --retry 3 -o "$SRC/libyaml.tar.gz" \
            "https://github.com/yaml/libyaml/releases/download/0.2.5/yaml-0.2.5.tar.gz"
          mkdir "$SRC/libyaml" && tar xzf "$SRC/libyaml.tar.gz" -C "$SRC/libyaml" --strip-components=1
          (
            cd "$SRC/libyaml"
            arch -x86_64 ./configure --prefix="$PREFIX"
            arch -x86_64 make -j"$JOBS"
            arch -x86_64 make install
          )

          # pcre2 — plain autotools build (8-bit library is what Crystal links).
          curl -fsSL --retry 3 -o "$SRC/pcre2.tar.gz" \
            "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz"
          mkdir "$SRC/pcre2" && tar xzf "$SRC/pcre2.tar.gz" -C "$SRC/pcre2" --strip-components=1
          (
            cd "$SRC/pcre2"
            arch -x86_64 ./configure --prefix="$PREFIX"
            arch -x86_64 make -j"$JOBS"
            arch -x86_64 make install
          )

          # Fail loudly (and early) when any of the .pc files the Crystal
          # link needs is missing — not minutes later in the build step.
          for pc in openssl.pc libcrypto.pc yaml-0.1.pc libpcre2-8.pc; do
            [ -f "$PREFIX/lib/pkgconfig/$pc" ] || { echo "::error::missing $pc under $PREFIX/lib/pkgconfig"; exit 1; }
          done
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          # CC wrapper: skip -arch x86_64 for macro programs (compiled for host arch)
          cat > /tmp/cc-wrapper << 'WRAPPER'
          #!/bin/bash
          for arg in "$@"; do
            case "$arg" in */.cache/crystal/*) exec /usr/bin/cc "$@" ;; esac
          done
          WRAPPER
          echo "exec /usr/bin/cc -arch x86_64 -L$PREFIX/lib \"\$@\"" >> /tmp/cc-wrapper
          chmod +x /tmp/cc-wrapper
          echo "CC=/tmp/cc-wrapper" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          # Git on Windows runners sometimes rejects the shards cache/worktree
          # with "detected dubious ownership"; allow any path so checkout works.
          git config --global --add safe.directory '*'
          # Run shards with stderr merged so any failure reason is visible in
          # the log (Crystal's stack trace goes to stderr). On failure, surface
          # diagnostics and re-emit the error before exiting non-zero.
          if ! shards install 2>&1; then
            echo "::error::shards install failed (see output above)"
            shards --version 2>/dev/null || true
            exit 1
          fi
          LINK_FLAGS="$(./scripts/build_miniaudio.sh ${{ matrix.target }})"
          TARGET_ARGS=""
          [ -n "${{ matrix.cross_target }}" ] && TARGET_ARGS="--target ${{ matrix.cross_target }}"
          crystal build src/h2code.cr -o h2code --release --no-debug --warnings none $TARGET_ARGS --link-flags "$LINK_FLAGS"
          if [ -f h2code.exe ]; then ./h2code.exe --version; else ./h2code --version; fi

      - name: Rebind Homebrew dylibs (macOS)
        if: startsWith(matrix.target, 'x86_64-darwin') || startsWith(matrix.target, 'aarch64-darwin')
        shell: bash
        run: |
          # Crystal links against Homebrew's libssl.3.dylib / libcrypto.3.dylib
          # with absolute install names (e.g. /usr/local/opt/openssl@3/lib/...).
          # On a user machine that path usually does not exist (Homebrew on
          # Apple Silicon lives under /opt/homebrew), so the binary fails with
          # dyld "Library not loaded". Rebind to @rpath and bundle the dylibs
          # next to the binary so the archive is self-contained.
          set -euo pipefail
          otool -L h2code
          # Only act on the Homebrew-linked OpenSSL dylibs.
          for lib in libssl.3.dylib libcrypto.3.dylib; do
            abs=$(otool -L h2code | grep -E "/.*/${lib}\b" | awk '{print $1}' | head -n1 || true)
            [ -n "$abs" ] || continue
            cp "$abs" "./${lib}"
            # Rewrite the dylib's own id and its dependency on the sibling.
            install_name_tool -id "@rpath/${lib}" "./${lib}"
            # NOTE the trailing "|| true": libcrypto has no ssl/crypto deps, so
            # grep finds nothing, exits 1, and under `set -euo pipefail` that
            # used to abort the whole step after the rebind was half-done.
            other=$(otool -L "./${lib}" | grep -E "/.*/(libssl.3|libcrypto.3).dylib\b" | awk '{print $1}' || true)
            for dep in $other; do
              depname=$(basename "$dep")
              install_name_tool -change "$dep" "@rpath/${depname}" "./${lib}"
            done
            # Point the binary at the rebundled copy.
            install_name_tool -change "$abs" "@rpath/${lib}" h2code
          done
          # Look beside the binary for the dylibs.
          install_name_tool -add_rpath @loader_path h2code 2>/dev/null || true
          # install_name_tool invalidated the Homebrew signatures of the
          # modified dylibs (see the warnings above); re-sign ad hoc or macOS
          # kills the binary on launch with an invalid code signature.
          for lib in libssl.3.dylib libcrypto.3.dylib; do
              [ -f "./${lib}" ] && codesign --force --sign - "./${lib}"
          done
          codesign --force --sign - h2code 2>/dev/null || true
          echo "--- after rebind ---"
          otool -L h2code

      - name: Collect Windows runtime DLLs
        if: matrix.target == 'x86_64-windows'
        shell: pwsh
        run: |
          # h2code.exe links dynamically against OpenSSL (libcrypto/libssl),
          # libyaml and pcre2. The Crystal Windows install bundles these DLLs;
          # ship them in a separate deps asset so install.ps1 can drop them
          # next to h2code.exe on machines that lack a package manager.
          $crystalDir = Split-Path (Get-Command crystal).Source
          $needed = @('libcrypto-3-x64.dll','libssl-3-x64.dll','pcre2-8.dll','yaml.dll')
          $found = @{}
          Get-ChildItem -Path $crystalDir -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $needed -contains $_.Name -and -not $found.ContainsKey($_.Name) } |
            ForEach-Object { $found[$_.Name] = $_.FullName }
          foreach ($name in $needed) {
            if (-not $found.ContainsKey($name)) {
              Write-Host "::warning::DLL not found in Crystal tree: $name"
            }
          }
          $staging = "deps-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($path in $found.Values) { Copy-Item $path -Destination $staging -Force }
          Compress-Archive -Path "$staging/*" -DestinationPath "h2code-deps-windows.zip" -Force
          Write-Host "Packaged deps:"
          Get-ChildItem $staging | Format-Table Name,Length

      # ---- Archive + upload ----
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "h2code-${{ matrix.target }}.tar.gz" h2code *.dylib 2>/dev/null || tar -czf "h2code-${{ matrix.target }}.tar.gz" h2code

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path h2code.exe -DestinationPath "h2code-${{ matrix.target }}.zip"

      - name: Generate SHA256
        shell: bash
        run: sha256sum h2code-${{ matrix.target }}.*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: h2code-${{ matrix.target }}
          path: |
            h2code-${{ matrix.target }}.*
            h2code-deps-windows.zip

  release:
    needs: [compute-version, build]
    # Only tag pushes publish a release; plain branch pushes just build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum h2code-* > ../h2code-checksums.txt
          cat ../h2code-checksums.txt

      - name: Create tag (if short form was pushed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/h2code-*
            h2code-checksums.txt
