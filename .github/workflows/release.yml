name: Release

on:
  push:
    branches: [master]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (YYYY.MM.DD, YYYY.MM.DD.N or auto-tag YYYY.MM.DD-<secs>)"
        required: true

permissions:
  contents: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (auto-increment build number per day)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Branch push / PR / merge queue: a CI build, not a release. Skip
          # version math. PR refs are "N/merge" (leading digit!), so gate on
          # the ref type instead of a digit heuristic. Dispatch runs pass a
          # version input and always take the release path below.
          if [ -z "${{ inputs.version }}" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the raw tag pushed (or the dispatch input).
          if [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          echo "Pushed tag: $RAW"

          # Post-commit auto-tags YYYY.MM.DD-<secs from day begin> (with
          # optional .N collision suffix) release under their own name —
          # every pushed tag publishes a release, one per tag.
          if [[ "$RAW" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+(\.[0-9]+)?$ ]]; then
            VERSION="$RAW"
          # YYYY.MM.DD form → compute next build number for that day.
          elif [[ "$RAW" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})$ ]]; then
            DAY="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            # Find existing release tags for this day and pick the max N.
            EXISTING=$(git tag -l "${DAY}.*" 2>/dev/null || true)
            MAX=0
            if [ -n "$EXISTING" ]; then
              for t in $EXISTING; do
                n=$(echo "$t" | awk -F. '{print $4}')
                n=${n:-0}
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            # Also check the GitHub releases API (covers tags pushed then deleted).
            LATEST_API=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null || true)
            if echo "$LATEST_API" | grep -qE "${DAY}\."; then
              for t in $(echo "$LATEST_API" | grep -oE "${DAY}\.[0-9]+"); do
                n=$(echo "$t" | awk -F. '{print $4}')
                if [ "$n" -gt "$MAX" ] 2>/dev/null; then MAX=$n; fi
              done
            fi
            N=$((MAX + 1))
            VERSION="${DAY}.${N}"
          elif [[ "$RAW" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            VERSION="$RAW"
          else
            echo "::error::Tag '$RAW' does not match YYYY.MM.DD, YYYY.MM.DD.N or YYYY.MM.DD-<secs> (auto-tag)"
            exit 1
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: compute-version
    runs-on: ${{ matrix.runner }}
    env:
      H2CODE_VERSION: ${{ needs.compute-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # One leg per runner; everything compiles through crosspack (the
        # crosspack.yml matrix steps). The darwin leg builds both arches in
        # a single `crosspack build macos` — the Intel cross-compile is a
        # gated matrix step there (H2CODE_BUILD_INTEL=1).
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
            crosspack_target: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-linux
            runner: ubuntu-24.04-arm
            crosspack_target: ubuntu-24.04
            archive: tar.gz
          - target: darwin
            runner: macos-latest
            crosspack_target: macos
            archive: tar.gz
          - target: x86_64-windows
            runner: windows-latest
            crosspack_target: windows-11.0
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Set up MSVC (Windows native build)
        if: matrix.target == 'x86_64-windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install crosspack
        shell: bash
        run: gem install crosspack -v 0.6.2 --no-document # keep in sync with Gemfile.lock

      - name: Cache x86_64 libraries (Intel macOS cross-build)
        if: matrix.target == 'darwin'
        uses: actions/cache@v4
        with:
          path: ~/x86_64-libs
          key: x86_64-libs-${{ hashFiles('scripts/build_h2code_intel.sh') }}

      - name: Build (crosspack)
        shell: bash
        env:
          H2CODE_BUILD_INTEL: ${{ matrix.target == 'darwin' && '1' || '0' }}
        run: |
          # Git on Windows runners sometimes rejects the shards cache/worktree
          # with "detected dubious ownership"; allow any path so checkout works
          # (shards install runs inside the crosspack matrix steps).
          git config --global --add safe.directory '*'
          crosspack build ${{ matrix.crosspack_target }} --version "$H2CODE_VERSION"
          BIN=build/bin/h2code
          [ -f build/bin/h2code.exe ] && BIN=build/bin/h2code.exe
          "$BIN" --version

      # ---- Archive + upload (from the crosspack artifacts.from dirs) ----
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          archive() { # <target-name> <bin-dir>
            (cd "$2" && tar -czf "../../h2code-$1.tar.gz" h2code *.dylib 2>/dev/null) || \
              (cd "$2" && tar -czf "../../h2code-$1.tar.gz" h2code)
          }
          case "${{ matrix.target }}" in
            x86_64-linux|aarch64-linux) archive "${{ matrix.target }}" build/bin ;;
            darwin)
              archive aarch64-darwin build/bin
              archive x86_64-darwin build/bin-x86_64
              ;;
          esac

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path build/bin/h2code.exe -DestinationPath "h2code-${{ matrix.target }}.zip"

      - name: Generate SHA256
        shell: bash
        run: sha256sum h2code-*

      - name: Upload artifact
        if: matrix.target != 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: h2code-${{ matrix.target }}
          path: |
            h2code-${{ matrix.target }}.*
            build/bin/h2code-deps-windows.zip

      - name: Upload artifact (aarch64-darwin)
        if: matrix.target == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: h2code-aarch64-darwin
          path: h2code-aarch64-darwin.tar.gz

      - name: Upload artifact (x86_64-darwin)
        if: matrix.target == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: h2code-x86_64-darwin
          path: h2code-x86_64-darwin.tar.gz

  release:
    needs: [compute-version, build]
    # Only tag pushes publish a release; plain branch pushes just build.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum h2code-* > ../h2code-checksums.txt
          cat ../h2code-checksums.txt

      - name: Create tag (if short form was pushed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts/h2code-*
            h2code-checksums.txt
