name: CI

on:
  push:
  pull_request:

# Fail-fast policy: ANY first failure cancels the whole run (matrix siblings
# and parallel jobs alike). Failures across jobs are almost always the same
# root cause, so stop, fix, and re-push instead of waiting for every job to
# fail identically.
permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install shards
        run: shards install

      - name: Spec
        run: rake spec

      - name: Cancel remaining jobs (first failure stops the run)
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

  # Integration: the tools run headlessly (no TTY, no user approval) against
  # the real system of each runner, exercising the platform ShellPort/HomePort
  # adapters. Windows runners have Git for Windows on PATH, so the win32
  # adapter's bash branch is covered; PowerShell fallback is covered by the
  # unit-level shell_port specs.
  integration:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install shards
        run: shards install

      - name: Integration specs (headless tool execution)
        run: rake spec:integration

      - name: Cancel remaining jobs (first failure stops the run)
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
