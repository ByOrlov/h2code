# GitLab CI analog of .github/workflows/ci.yml + release.yml (Linux only for
# now; macOS/Windows jobs will be added on self-hosted runners later).
#
# Runner requirements: a runner with the Docker executor (pull_policy =
# if-not-present). The job image is built once per runner host with
# `ci/runner/build-image.sh` (crystallang/crystal:1.21.0 + ripgrep + rake) so
# jobs start warm — no per-job apt-get.

stages:
  - check
  - integration
  - build

default:
  image: h2code-ci:1.21.0

variables:
  # Full clone with tags so the Rakefile's `git describe` version fallback
  # (h2code_build_version) works on branch builds.
  GIT_DEPTH: "0"
  # Compiler macro/dependency artifacts on the runner's persistent /cache
  # bind mount (GitLab server-side `cache:` is unavailable on this runner —
  # no object storage), so crystal spec/build don't recompile from scratch.
  CRYSTAL_CACHE_DIR: "/cache/h2code/crystal"

check:
  stage: check
  script:
    - shards install
    - rake spec

integration:
  stage: integration
  script:
    - shards install
    - rake spec:integration

# Release build, mirroring the Linux leg of the GitHub release matrix. Unlike
# GitHub, the pushed tag is used as the version verbatim (no YYYY.MM.DD →
# YYYY.MM.DD.N auto-increment — pass the full version when tagging).
build:x86_64-linux:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - shards install
    - export H2CODE_VERSION="${CI_COMMIT_TAG:-0.0.0-ci}"
    - LINK_FLAGS="$(./scripts/build_miniaudio.sh x86_64-linux)"
    - crystal build src/h2code.cr -o h2code --release --no-debug --warnings none --link-flags "$LINK_FLAGS"
    - ./h2code --version
    - tar -czf h2code-x86_64-linux.tar.gz h2code
    - sha256sum h2code-x86_64-linux.tar.gz > h2code-x86_64-linux.tar.gz.sha256
    - cat h2code-x86_64-linux.tar.gz.sha256
  artifacts:
    name: h2code-x86_64-linux
    paths:
      - h2code-x86_64-linux.tar.gz
      - h2code-x86_64-linux.tar.gz.sha256
